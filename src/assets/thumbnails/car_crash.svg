<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0D0D0D"/>
      <stop offset="100%" stop-color="#1A1A2E"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="greenClass" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg3)"/>

  <!-- Subtle glow -->
  <circle cx="400" cy="200" r="250" fill="rgba(239,68,68,0.04)"/>

  <!-- Car top-view silhouette (centered) -->
  <g transform="translate(215, 55)">
    <!-- Car body -->
    <rect x="80" y="20" width="210" height="280" rx="30" fill="rgba(255,255,255,0.07)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
    <!-- Windshield front -->
    <rect x="100" y="40" width="170" height="60" rx="10" fill="rgba(14,165,233,0.2)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
    <!-- Windshield rear -->
    <rect x="100" y="220" width="170" height="55" rx="10" fill="rgba(14,165,233,0.2)" stroke="rgba(14,165,233,0.4)" stroke-width="1"/>
    <!-- Hood lines -->
    <line x1="170" y1="20" x2="170" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="200" y1="20" x2="200" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Trunk lines -->
    <line x1="170" y1="275" x2="170" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <line x1="200" y1="275" x2="200" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5"/>
    <!-- Wheels FL -->
    <rect x="50" y="50" width="35" height="65" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Wheels FR -->
    <rect x="285" y="50" width="35" height="65" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Wheels RL -->
    <rect x="50" y="205" width="35" height="65" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
    <!-- Wheels RR -->
    <rect x="285" y="205" width="35" height="65" rx="8" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>

    <!-- Damage zones highlighted -->
    <!-- Front damage (red overlay) -->
    <rect x="80" y="20" width="210" height="50" rx="12" fill="rgba(239,68,68,0.35)" stroke="#EF4444" stroke-width="1.5" stroke-dasharray="4,3"/>
    <text x="185" y="50" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" font-weight="bold">FRONT</text>
    <!-- Rear damage -->
    <rect x="80" y="250" width="210" height="50" rx="12" fill="rgba(239,68,68,0.2)" stroke="#EF4444" stroke-width="1" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="185" y="280" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">REAR</text>
  </g>

  <!-- Classification labels (right) -->
  <rect x="545" y="55" width="215" height="300" rx="14" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="652" y="85" fill="rgba(255,255,255,0.55)" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" letter-spacing="2">CLASSES</text>

  <!-- Class items -->
  <rect x="562" y="98" width="180" height="28" rx="6" fill="rgba(239,68,68,0.25)" stroke="#EF4444" stroke-width="0.8"/>
  <text x="652" y="117" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Front Breakage</text>
  <rect x="562" y="133" width="180" height="28" rx="6" fill="rgba(239,68,68,0.4)" stroke="#EF4444" stroke-width="0.8"/>
  <text x="652" y="152" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Front Crushed</text>
  <rect x="562" y="168" width="180" height="28" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10B981" stroke-width="0.8"/>
  <text x="652" y="187" fill="#6EE7B7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Front Normal</text>
  <rect x="562" y="203" width="180" height="28" rx="6" fill="rgba(239,68,68,0.25)" stroke="#EF4444" stroke-width="0.8"/>
  <text x="652" y="222" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Rear Breakage</text>
  <rect x="562" y="238" width="180" height="28" rx="6" fill="rgba(239,68,68,0.4)" stroke="#EF4444" stroke-width="0.8"/>
  <text x="652" y="257" fill="#FCA5A5" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Rear Crushed</text>
  <rect x="562" y="273" width="180" height="28" rx="6" fill="rgba(16,185,129,0.25)" stroke="#10B981" stroke-width="0.8"/>
  <text x="652" y="292" fill="#6EE7B7" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">Rear Normal</text>

  <!-- ResNet50 badge -->
  <rect x="562" y="315" width="180" height="28" rx="8" fill="rgba(99,102,241,0.3)" stroke="#818CF8" stroke-width="1"/>
  <text x="652" y="334" fill="#A5B4FC" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">ResNet50 · Transfer Learning</text>

  <!-- Bottom title -->
  <text x="400" y="398" fill="white" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" text-anchor="middle">Car Crash Damage Classifier</text>
  <text x="400" y="426" fill="#64748B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2.5">DEEP LEARNING  ·  PYTORCH  ·  RESNET50</text>
</svg>
