<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#052E16"/>
      <stop offset="100%" stop-color="#0D2B1D"/>
    </linearGradient>
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg4)"/>

  <!-- Glow -->
  <circle cx="200" cy="200" r="200" fill="rgba(16,185,129,0.05)"/>
  <circle cx="600" cy="220" r="180" fill="rgba(16,185,129,0.04)"/>

  <!-- Terminal window -->
  <rect x="45" y="50" width="380" height="310" rx="12" fill="url(#termBg)" stroke="rgba(16,185,129,0.25)" stroke-width="1.5"/>
  <!-- Terminal header bar -->
  <rect x="45" y="50" width="380" height="38" rx="12" fill="#1F2937"/>
  <rect x="45" y="70" width="380" height="18" fill="#1F2937"/>
  <!-- Traffic lights -->
  <circle cx="76" cy="69" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="98" cy="69" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="120" cy="69" r="6" fill="#10B981" opacity="0.8"/>
  <text x="236" y="74" fill="rgba(255,255,255,0.4)" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">log_classifier — server.py</text>

  <!-- Terminal content -->
  <text x="65" y="115" fill="#10B981" font-family="'Courier New', monospace" font-size="11">$ uvicorn server:app --reload</text>
  <text x="65" y="135" fill="rgba(255,255,255,0.5)" font-family="'Courier New', monospace" font-size="10">INFO: Uvicorn running on :8000</text>
  <text x="65" y="155" fill="rgba(255,255,255,0.35)" font-family="'Courier New', monospace" font-size="10">POST /classify  [log_batch.csv]</text>

  <!-- Log lines flowing -->
  <text x="65" y="185" fill="#60A5FA" font-family="'Courier New', monospace" font-size="10">kernel: [2.4s] USB disconnect</text>
  <text x="65" y="202" fill="#34D399" font-family="'Courier New', monospace" font-size="10">ERROR: Connection timeout 500ms</text>
  <text x="65" y="219" fill="#FBBF24" font-family="'Courier New', monospace" font-size="10">sshd: Accepted password from IP</text>
  <text x="65" y="236" fill="#60A5FA" font-family="'Courier New', monospace" font-size="10">systemd: Started network service</text>
  <text x="65" y="253" fill="#F87171" font-family="'Courier New', monospace" font-size="10">WARN: Memory usage above 85%</text>
  <text x="65" y="270" fill="#34D399" font-family="'Courier New', monospace" font-size="10">cron: Job completed successfully</text>
  <text x="65" y="288" fill="rgba(255,255,255,0.2)" font-family="'Courier New', monospace" font-size="10">...</text>

  <!-- Output badge -->
  <rect x="65" y="300" width="200" height="28" rx="6" fill="rgba(16,185,129,0.15)" stroke="#10B981" stroke-width="1"/>
  <text x="165" y="319" fill="#34D399" font-family="'Courier New', monospace" font-size="10" text-anchor="middle">→ target_label appended</text>

  <!-- Three classifiers (right side) -->
  <text x="600" y="85" fill="rgba(255,255,255,0.55)" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">HYBRID PIPELINE</text>

  <!-- Regex box -->
  <rect x="475" y="105" width="250" height="68" rx="10" fill="rgba(96,165,250,0.12)" stroke="#60A5FA" stroke-width="1.2"/>
  <text x="600" y="130" fill="#93C5FD" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold">① Regex</text>
  <text x="600" y="150" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Predictable / structured patterns</text>
  <text x="600" y="165" fill="rgba(255,255,255,0.3)" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Fast · Rule-based</text>

  <!-- Arrow -->
  <line x1="600" y1="173" x2="600" y2="193" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <polygon points="594,191 606,191 600,200" fill="rgba(255,255,255,0.2)"/>

  <!-- ML box -->
  <rect x="475" y="202" width="250" height="68" rx="10" fill="rgba(251,191,36,0.1)" stroke="#FBBF24" stroke-width="1.2"/>
  <text x="600" y="227" fill="#FDE68A" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold">② Sentence Transformer + LR</text>
  <text x="600" y="247" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Complex patterns · Sufficient data</text>
  <text x="600" y="262" fill="rgba(255,255,255,0.3)" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">Embeddings · Logistic Regression</text>

  <!-- Arrow -->
  <line x1="600" y1="270" x2="600" y2="290" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <polygon points="594,288 606,288 600,297" fill="rgba(255,255,255,0.2)"/>

  <!-- LLM box -->
  <rect x="475" y="299" width="250" height="68" rx="10" fill="rgba(167,139,250,0.12)" stroke="#A78BFA" stroke-width="1.2"/>
  <text x="600" y="324" fill="#C4B5FD" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" font-weight="bold">③ LLM Fallback</text>
  <text x="600" y="344" fill="rgba(255,255,255,0.45)" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">Complex · Limited labeled data</text>
  <text x="600" y="359" fill="rgba(255,255,255,0.3)" font-family="Arial, sans-serif" font-size="9" text-anchor="middle">LLM inference · Zero-shot</text>

  <!-- Bottom title -->
  <text x="400" y="398" fill="white" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" text-anchor="middle">Hybrid Log Classification</text>
  <text x="400" y="426" fill="#64748B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2.5">NLP  ·  FASTAPI  ·  SENTENCE TRANSFORMERS</text>
</svg>
