<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#1C0A00"/>
      <stop offset="100%" stop-color="#2D1A00"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg2)"/>

  <!-- Decorative glow -->
  <circle cx="160" cy="200" r="180" fill="rgba(249,115,22,0.07)"/>
  <circle cx="640" cy="250" r="150" fill="rgba(14,165,233,0.07)"/>

  <!-- Chat interface panel -->
  <rect x="55" y="55" width="320" height="310" rx="16" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.12)" stroke-width="1.2"/>
  <!-- Panel header -->
  <rect x="55" y="55" width="320" height="46" rx="16" fill="url(#orangeGrad)" opacity="0.9"/>
  <rect x="55" y="83" width="320" height="18" fill="url(#orangeGrad)" opacity="0.9"/>
  <!-- Header dots -->
  <circle cx="84" cy="78" r="6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="104" cy="78" r="6" fill="rgba(255,255,255,0.5)"/>
  <circle cx="124" cy="78" r="6" fill="rgba(255,255,255,0.5)"/>
  <text x="215" y="83" fill="white" font-family="Arial, sans-serif" font-size="13" font-weight="bold" text-anchor="middle">Flipkart AI Assistant</text>

  <!-- User message bubble -->
  <rect x="140" y="120" width="210" height="38" rx="18" fill="url(#orangeGrad)" opacity="0.85"/>
  <text x="245" y="144" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Nike shoes under ₹3000?</text>

  <!-- Bot message bubble -->
  <rect x="75" y="174" width="240" height="52" rx="14" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="90" y="196" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="11">Found 8 products:</text>
  <text x="90" y="214" fill="#4ADE80" font-family="'Courier New', monospace" font-size="10">SELECT * FROM products WHERE...</text>

  <!-- User message 2 -->
  <rect x="155" y="244" width="194" height="38" rx="18" fill="url(#orangeGrad)" opacity="0.85"/>
  <text x="252" y="268" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle">Return policy?</text>

  <!-- Bot message 3 -->
  <rect x="75" y="298" width="260" height="38" rx="14" fill="rgba(255,255,255,0.09)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="90" y="316" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="11">Returns accepted within 30</text>
  <text x="90" y="331" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="11">days. Free pickup available.</text>

  <!-- Architecture diagram (right side) -->
  <rect x="420" y="55" width="340" height="310" rx="16" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.09)" stroke-width="1.2"/>
  <text x="590" y="90" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2">ARCHITECTURE</text>

  <!-- Nodes -->
  <rect x="490" y="108" width="120" height="36" rx="8" fill="url(#blueGrad)" opacity="0.85"/>
  <text x="550" y="131" fill="white" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" font-weight="bold">Semantic Router</text>

  <!-- Arrow down left -->
  <line x1="516" y1="144" x2="490" y2="185" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Arrow down right -->
  <line x1="584" y1="144" x2="610" y2="185" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- FAQ node -->
  <rect x="440" y="185" width="100" height="36" rx="8" fill="rgba(249,115,22,0.7)"/>
  <text x="490" y="208" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">FAQ RAG</text>

  <!-- SQL node -->
  <rect x="558" y="185" width="100" height="36" rx="8" fill="rgba(14,165,233,0.7)"/>
  <text x="608" y="208" fill="white" font-family="Arial, sans-serif" font-size="11" text-anchor="middle">SQL Agent</text>

  <!-- Arrow down from FAQ -->
  <line x1="490" y1="221" x2="490" y2="255" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>
  <!-- Arrow down from SQL -->
  <line x1="608" y1="221" x2="608" y2="255" stroke="rgba(255,255,255,0.3)" stroke-width="1.5"/>

  <!-- ChromaDB node -->
  <rect x="440" y="255" width="100" height="32" rx="8" fill="rgba(139,92,246,0.6)"/>
  <text x="490" y="276" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">ChromaDB</text>

  <!-- SQLite node -->
  <rect x="558" y="255" width="100" height="32" rx="8" fill="rgba(16,185,129,0.6)"/>
  <text x="608" y="276" fill="white" font-family="Arial, sans-serif" font-size="10" text-anchor="middle">SQLite DB</text>

  <!-- LLaMA label -->
  <rect x="480" y="305" width="140" height="32" rx="8" fill="rgba(255,255,255,0.06)" stroke="rgba(249,115,22,0.5)" stroke-width="1.2"/>
  <text x="550" y="326" fill="#FB923C" font-family="Arial, sans-serif" font-size="11" text-anchor="middle" font-weight="bold">LLaMA 3.3 · Groq</text>

  <!-- Bottom title -->
  <text x="400" y="398" fill="white" font-family="Georgia, 'Times New Roman', serif" font-size="25" font-weight="bold" text-anchor="middle">Flipkart E-Commerce Chatbot</text>
  <text x="400" y="426" fill="#64748B" font-family="Arial, sans-serif" font-size="12" text-anchor="middle" letter-spacing="2.5">RAG  ·  SQL AGENT  ·  SEMANTIC ROUTING</text>
</svg>
